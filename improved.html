<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知更鸟 · 优化体验</title><style>:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#27231f;background:#f5f2ec;font-size:18px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,summary{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #d44319;outline-offset:4px}header,main,footer{max-width:1240px;margin:auto}header{display:flex;align-items:center;gap:20px;padding:28px 32px}.brand{font-size:30px;font-weight:900;text-decoration:none;color:#f04e25}.badge{font-size:16px;background:#fce0d1;padding:8px 12px;border-radius:6px}.back{margin-left:auto;color:#50473f}main{padding:0 32px}.hero{background:#ff582d;border-radius:24px;padding:40px 44px;display:flex;justify-content:space-between;overflow:hidden}.eyebrow{font-weight:700;margin:0}h1{font-size:clamp(40px,5vw,64px);line-height:1.13;letter-spacing:-2px;margin:22px 0;color:#fff7e8}h1 span{color:#2a2420;margin-left:22px}.hero p:last-child{margin-bottom:0}.hero-side{display:flex;flex-direction:column;justify-content:space-between;border-left:1px solid #bd3e20;padding-left:40px;min-width:310px}.hero-side strong{font-size:32px;line-height:1.5}.hero-side span{font-size:17px}nav{display:flex;gap:12px;margin:28px 0 18px}nav button{border:1px solid #ddd3c6;background:white;border-radius:10px;padding:17px 24px;font-weight:700;font-size:20px}nav button[aria-pressed=true]{background:#29231f;color:white;border-color:#29231f}.demo-note{font-size:17px;color:#736457;margin:16px 0 24px}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.panel{padding:28px;background:#fffdfa;border:1px solid #e2d9ce;border-radius:16px}h2{font-size:27px;margin:0 0 22px}h3{font-size:22px;margin:0 0 14px}.step{display:block;font-weight:700;margin:25px 0 14px}.step:first-child{margin-top:0}.choices{display:flex;gap:10px;flex-wrap:wrap}.chip{border:1px solid #d6c9b9;background:white;padding:12px 16px;border-radius:8px}.chip[aria-pressed=true]{border-color:#ef5127;background:#fff0e7;color:#b73313;font-weight:700}.sources{display:grid;gap:10px}.source{display:flex;align-items:flex-start;gap:12px;padding:16px;background:#f8f4ef;border-radius:9px;cursor:pointer}.source input{width:21px;height:21px;accent-color:#ed5228}.source small{display:block;font-size:17px;line-height:1.6;color:#756455;margin-top:6px}textarea,select,input[type=search]{width:100%;border:1px solid #cfc2b2;padding:13px;border-radius:8px;background:white}textarea{margin-top:14px;min-height:100px}details{margin:18px 0}summary{cursor:pointer;color:#a53f20;line-height:1.6}.primary{border:0;background:#f0542b;color:white;padding:16px 24px;border-radius:8px;font-weight:700;font-size:21px;width:100%;margin-top:24px}.secondary{border:1px solid #cdbfac;background:#fffdfa;border-radius:8px;padding:12px 18px}.muted{color:#766858;line-height:1.7}.empty{min-height:310px;display:flex;flex-direction:column;justify-content:center}.big-mark{font-size:68px;color:#f0542b;line-height:1}.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.pill{font-size:16px;background:#fce4ce;color:#86421e;padding:6px 10px;border-radius:5px}.result-row{padding:17px 0;border-bottom:1px solid #eadfd2;line-height:1.7}.result-row strong{display:block;margin-bottom:4px}.risk-box{background:#fff0d9;border-radius:10px;padding:18px;margin-top:18px;line-height:1.7}.risk-box details{margin-bottom:0}.filters{display:flex;gap:16px;align-items:end;margin-bottom:22px}.filters label{flex:1;line-height:2}.history-list{display:grid;gap:12px}.record{text-align:left;background:white;border:1px solid #ded4c8;border-radius:10px;padding:20px;width:100%}.record[aria-pressed=true]{border:2px solid #ef5127;background:#fff1e8}.record strong{display:block;font-size:22px;margin:10px 0}.record span{font-size:17px;color:#786857}.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.risk-grid p{line-height:1.8}.risk-grid details{border-top:1px solid #e5d7c5;padding-top:16px}footer{padding:35px 32px;font-size:16px;color:#786857}[hidden]{display:none!important}@media(max-width:750px){header{padding:20px;gap:10px;flex-wrap:wrap}.brand{font-size:25px}.back{font-size:16px}main{padding:0 16px}.hero{padding:28px}.hero-side{display:none}nav{gap:7px}nav button{flex:1;font-size:17px;padding:14px 7px}.layout,.risk-grid{grid-template-columns:1fr}.panel{padding:22px}.filters{flex-direction:column;align-items:stretch}.badge{font-size:14px}h1{font-size:46px}}
</style></head><body><header><a class="brand" href="./">↗ 知更鸟</a><span class="badge">优化体验 · DEMO</span><a class="back" href="./">返回社区 ↗</a></header><main><section class="hero"><div><p class="eyebrow">少点操作，多点判断</p><h1>下一步，<br>看清再决定<span>↗</span></h1><p>选问题、选资料，让分析更直接</p></div><div class="hero-side"><strong>你的判断<br>值得多看一面</strong><span>AI 分析 / 历史复盘 / 风险解读</span></div></section><nav aria-label="优化功能"><button data-tab="analysis" aria-pressed="true">01 AI 分析</button><button data-tab="history" aria-pressed="false">02 历史复盘</button><button data-tab="risk" aria-pressed="false">03 风险解读</button></nav><p class="demo-note">演示资料与预设结果 · 无需登录或配置密钥</p><div id="content"></div></main><footer>知更鸟 · 优化体验独立演示</footer><script>const root=document.querySelector('#content');
const state={tab:'analysis',symbol:'NVDA',question:'多空分析',sources:new Set(['财报摘要','估值对比']),note:'',result:false,filter:'全部',search:'',selected:1};
const records=[{id:1,symbol:'NVDA',date:'2026-10-23',title:'增长能否支撑高估值',before:'看涨 · 需求持续增长',after:'假设营收增长，但指引低于原先预期',lesson:'将营收增长与估值是否合理分开判断',risk:'估值偏高'},{id:2,symbol:'TSLA',date:'2026-10-20',title:'降价能否换来销量增长',before:'看涨 · 降价扩大需求',after:'假设交付增加，但单车利润下降',lesson:'销量增长不等于利润增长',risk:'利润承压'},{id:3,symbol:'AAPL',date:'2026-10-16',title:'新品需求是否超出预期',before:'震荡 · 等待需求确认',after:'假设首周订单强劲，后续需求仍未确认',lesson:'短期热度需要持续订单支撑',risk:'信息不足'}];
const explanations={'估值偏高':['价格可能已经提前反映乐观预期','即使公司增长，若增长不及预期，价格仍可能下跌','核对增长预期与估值水平，列出不及预期时的情形'],'利润承压':['收入增加，留下的利润却可能减少','降价或成本上升，可能抵消销量增长带来的收益','同时观察收入、成本和利润率'],'信息不足':['现有资料还不能支撑明确结论','缺少关键资料时，结论容易受单一消息影响','补充原始来源，并确认消息时间和适用范围']};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function risk(name){const e=explanations[name];return `<div class="risk-box"><strong>⚠ ${name}</strong><details><summary>这意味着什么</summary><p>${e[0]}</p><p>${e[1]}</p><strong>下一步</strong><p>${e[2]}</p></details></div>`;}
function result(){return `<div class="result-head"><h2>${state.symbol} · ${state.question}</h2><span class="pill">预设演示</span></div><div class="result-row"><strong>先看结论</strong>${state.question==='找反例'?'优先检查增长放缓、竞争降价等可能推翻原判断的情形':state.question==='检查前提'?'原判断需要持续增长与利润稳定两个前提，当前假设资料尚不足以确认':'在这个假设场景中，增长与估值存在分歧，需要同时检查支持理由和反例'}</div>${state.sources.has('财报摘要')?'<div class="result-row"><strong>↗ 支持理由 · 财报摘要</strong>假设营收增长 20%，需求增长提供支持</div>':''}${state.sources.has('估值对比')?'<div class="result-row"><strong>↘ 反方理由 · 估值对比</strong>假设市盈率 35 倍，高于对照组 25 倍，增长预期可能已反映在价格中</div>':''}${state.sources.has('行业消息')?'<div class="result-row"><strong>待观察 · 行业消息</strong>假设下游需求增加，但低价竞争可能影响利润</div>':''}${state.note?'<div class="result-row"><strong>你的补充</strong>'+escapeHtml(state.note)+'<br><span class="muted">已列入待核查内容，预设演示不对自填内容生成判断</span></div>':''}${risk(state.sources.has('估值对比')?'估值偏高':'信息不足')}<p class="muted">仅基于已选假设资料，不代表真实行情或投资建议</p><button class="secondary" id="edit-analysis">修改选择</button>`;}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===state.tab)));if(state.tab==='analysis'){root.innerHTML=`<div class="layout"><section class="panel"><h2>这次想看什么</h2><span class="step">1 选择股票</span><div class="choices">${['NVDA','TSLA','AAPL','MSFT'].map(s=>`<button class="chip" data-symbol="${s}" aria-pressed="${s===state.symbol}">${s}</button>`).join('')}</div><span class="step">2 选择问题</span><div class="choices">${['多空分析','找反例','检查前提'].map(s=>`<button class="chip" data-question="${s}" aria-pressed="${s===state.question}">${s}</button>`).join('')}</div><span class="step">3 确认资料 <span class="pill">假设场景</span></span><div class="sources">${[['财报摘要','假设营收增长 20%'],['估值对比','假设市盈率 35 倍，对照组 25 倍'],['行业消息','假设需求增加，同时出现低价竞争']].map(([t,d])=>`<label class="source"><input type="checkbox" value="${t}" ${state.sources.has(t)?'checked':''}><span><strong>${t}</strong><small>${d}</small></span></label>`).join('')}</div><details ${state.note?'open':''}><summary>自行补充</summary><label for="extra-note">补充观察</label><textarea id="extra-note" maxlength="1000" placeholder="也可以写下自己的观察">${escapeHtml(state.note)}</textarea></details><button class="primary" id="generate" ${state.sources.size?'':'disabled'}>查看分析演示 ↗</button><p class="muted" id="selection-summary" aria-live="polite">已选 ${state.sources.size} 份演示资料${state.sources.size?'':' · 请至少选择一份'}</p></section><section class="panel" id="result" aria-live="polite">${state.result?result():'<div class="empty"><span class="big-mark">↗</span><h2>让观点多一面依据</h2><p class="muted">确认左侧选项，即可查看多空理由与风险解读</p><span class="pill">平台服务流程预览 · 当前为预设演示</span></div>'}</section></div>`;bindAnalysis();}else if(state.tab==='history')renderHistory();else root.innerHTML=`<h2>风险提示，说清楚一点</h2><div class="risk-grid">${Object.entries(explanations).map(([n,e])=>`<article class="panel"><span class="pill">风险解读</span><h2 style="margin-top:20px">${n}</h2><p>${e[0]}</p><details><summary>查看例子与下一步</summary><p>${e[1]}</p><h3>你可以这样检查</h3><p>${e[2]}</p></details></article>`).join('')}</div>`;}
function bindAnalysis(){root.querySelectorAll('[data-symbol]').forEach(b=>b.onclick=()=>{state.symbol=b.dataset.symbol;state.result=false;render();});root.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{state.question=b.dataset.question;state.result=false;render();});root.querySelectorAll('.source input').forEach(c=>c.onchange=()=>{c.checked?state.sources.add(c.value):state.sources.delete(c.value);state.result=false;render();});root.querySelector('#extra-note').oninput=e=>{state.note=e.target.value;state.result=false;root.querySelector('#result').innerHTML='<div class="empty"><h2>资料已更新</h2><p class="muted">确认后重新查看分析演示</p></div>';};root.querySelector('#generate').onclick=()=>{if(!state.sources.size)return;state.result=true;render();root.querySelector('#result').scrollIntoView({behavior:'smooth',block:'start'});};const edit=root.querySelector('#edit-analysis');if(edit)edit.onclick=()=>{state.result=false;render();root.querySelector('[data-symbol]').focus();};}
function renderHistory(){const matches=records.filter(r=>(state.filter==='全部'||r.symbol===state.filter)&&(r.title+r.symbol+r.before+r.after+r.date).toLowerCase().includes(state.search.toLowerCase()));if(!matches.some(r=>r.id===state.selected))state.selected=matches[0]?.id;const selected=matches.find(r=>r.id===state.selected);root.innerHTML=`<div class="filters"><label>股票筛选<select id="history-symbol">${['全部','NVDA','TSLA','AAPL'].map(s=>`<option ${s===state.filter?'selected':''}>${s}</option>`).join('')}</select></label><label>查找旧记录<input type="search" id="history-search" value="${escapeHtml(state.search)}" placeholder="搜索观点或股票"></label></div><div class="layout"><section><div class="result-head"><h2>历史记录</h2><span class="pill">${matches.length} 条演示记录</span></div><div class="history-list">${matches.map(r=>`<button class="record" data-record="${r.id}" aria-pressed="${r.id===state.selected}"><span>${r.symbol} · ${r.date} · 演示</span><strong>${r.title}</strong><span>${r.before}</span></button>`).join('')||'<p class="panel" role="status">没有匹配记录，换个关键词试试</p>'}</div></section><section class="panel" aria-live="polite">${selected?`<div class="result-head"><h2>${selected.symbol} · 复盘预览</h2><span class="pill">预设演示</span></div><h3>${selected.title}</h3><div class="result-row"><strong>当时怎么想</strong>${selected.before}</div><div class="result-row"><strong>后来发生了什么</strong>${selected.after}</div><div class="result-row"><strong>下次怎么改</strong>${selected.lesson}</div>${risk(selected.risk)}`:'<h2>暂无预览</h2><p class="muted">修改筛选条件后选择记录</p>'}</section></div>`;root.querySelector('#history-symbol').onchange=e=>{state.filter=e.target.value;renderHistory();};root.querySelector('#history-search').oninput=e=>{const cursor=e.target.selectionStart;state.search=e.target.value;renderHistory();const input=root.querySelector('#history-search');input.focus();input.setSelectionRange(cursor,cursor);};root.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.record);renderHistory();});}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();});render();
</script></body></html>
